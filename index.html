<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Rubik 3D & 3 Vòng Tròn Đồng Tâm</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Header gọn gàng tinh giản chữ -->
  <header class="app-header">
    <div class="logo-area">
      <span class="logo-text">🧊 <span class="btn-lbl">RUBIK 3D</span></span>
      <span id="status-badge" class="badge-tag">🟢 <span class="btn-lbl">NGUYÊN BẢN</span></span>
    </div>

    <!-- Bộ đếm Bước & Thời gian (Toggleable hiển thị) -->
    <div id="stats-bar" class="stats-bar">
      <div class="stat-item"><span class="stat-label">BƯỚC:</span> <span id="move-count" class="stat-val">0</span></div>
      <div class="stat-item"><span class="stat-label">GIỜ:</span> <span id="timer-display" class="stat-val">00:00.00</span></div>
    </div>

    <!-- Nút hành động nhanh: Menu Con Mắt & Xáo Trộn -->
    <div class="header-actions">
      <div class="display-menu-container">
        <button id="btn-display-toggle" class="btn-header" title="Tùy chọn hiển thị & ẩn hiện tính năng">👁️ <span class="btn-lbl">HIỂN THỊ</span></button>
        <!-- Popover Tùy chọn giao diện -->
        <div id="display-popover" class="display-popover" style="display: none;">
          <div class="popover-header">
            <span>👁️ TÙY CHỌN HIỂN THỊ</span>
            <button id="btn-close-popover" class="btn-close-popover" title="Đóng">✕</button>
          </div>
          <div class="popover-body">
            <label class="popover-option">
              <input type="checkbox" id="chk-labels" checked>
              <div class="option-info">
                <span class="option-title">🏷️ Nhãn chữ nút bấm</span>
                <span class="option-desc">Bật: Icon + Chữ | Tắt: Chỉ giữ Icon (Pro Mode)</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-stats" checked>
              <div class="option-info">
                <span class="option-title">⏱️ Bộ đếm Bước & Thời gian</span>
                <span class="option-desc">Hiện thông số chơi game</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-move-bar" checked>
              <div class="option-info">
                <span class="option-title">⌨️ Thanh 12 phím xoay</span>
                <span class="option-desc">Dải nút U, U', D, D', L, L'...</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-sound" checked>
              <div class="option-info">
                <span class="option-title">🔊 Âm thanh click</span>
                <span class="option-desc">Âm thanh click khi xoay khối</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-auto-solve">
              <div class="option-info">
                <span class="option-title">⚡ Nút Tự Giải Hết</span>
                <span class="option-desc">Hiện nút máy tự xoay giải 6 mặt (Mặc định ẩn)</span>
              </div>
            </label>
          </div>
        </div>
      </div>
      <button id="btn-scramble" class="btn-header btn-scramble" title="Xáo trộn ngẫu nhiên Rubik">🔀 <span class="btn-lbl">Xáo Trộn</span></button>
    </div>
  </header>

  <!-- Bố cục chính tự thích ứng Desktop & Mobile (0 cuộn trang) -->
  <main class="main-layout">
    <!-- KHU VỰC 1: Khối 3D & 3 Gương Soi -->
    <section class="viewport-3d-col">
      <!-- Chip gương nhỏ gọn -->
      <div class="overlay-mirrors-chip">
        🪞 Gương sau: <span style="color:#22c55e">B</span> | <span style="color:#e11d48">L</span> | <span style="color:#ffffff">D</span>
      </div>

      <!-- Nút điều khiển Zoom nhanh -->
      <div class="zoom-controls">
        <button id="btn-zoom-in" class="btn-zoom" title="Phóng to (+)">+</button>
        <button id="btn-zoom-out" class="btn-zoom" title="Thu nhỏ (−)">−</button>
      </div>

      <!-- Canvas 3D Three.js -->
      <div id="rubik-canvas" class="canvas-wrapper">
        <!-- Nút Play ngón cái chuyên dụng (Vị trí 1 - Golden Thumb Zone) -->
        <button id="btn-coach-step" class="btn-thumb-play" title="Xoay đúng 1 nước tiếp theo (Nước đôi L2 = bấm L 2 lần)">
          <span class="thumb-icon">▶</span>
          <span class="btn-lbl">1 Nước</span>
        </button>
      </div>

      <!-- Thanh điều khiển trung tâm: Reset View & Reset Rubik + Thanh 12 phím xoay -->
      <div class="controls-bar" id="controls-bar">
        <!-- 2 Nút Reset đặt cạnh nhau ở giữa -->
        <div class="reset-actions-group">
          <button id="btn-reset-view" class="btn-action btn-reset-special" title="Đặt lại góc nhìn 3D chuẩn">🎥 <span class="btn-lbl">RESET VIEW</span></button>
          <button id="btn-reset-rubik" class="btn-action btn-reset-special" title="Khôi phục Rubik về nguyên bản 6 mặt">🧊 <span class="btn-lbl">RESET RUBIK</span></button>
        </div>

        <!-- Dải 12 phím xoay (có thể ẩn/hiện) -->
        <div id="quick-move-bar" class="quick-move-bar">
          <div class="move-group">
            <button class="btn-move" data-move="U">U</button>
            <button class="btn-move" data-move="U'">U'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="D">D</button>
            <button class="btn-move" data-move="D'">D'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="L">L</button>
            <button class="btn-move" data-move="L'">L'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="R">R</button>
            <button class="btn-move" data-move="R'">R'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="F">F</button>
            <button class="btn-move" data-move="F'">F'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="B">B</button>
            <button class="btn-move" data-move="B'">B'</button>
          </div>
        </div>
      </div>
    </section>

    <!-- KHU VỰC 2: Bản Đồ 3 Vòng Tròn Giao Điểm & Thanh Học Công Thức -->
    <section class="right-panel">
      <!-- Bản đồ phẳng hóa 2D (Chuyển đổi giữa 3 Vòng Tròn và Hướng Tâm) -->
      <div class="mandala-section">
        <div class="section-header">
          <div class="view-mode-tabs">
            <button id="tab-mandala" class="tab-btn active" title="Bản đồ 3 Vòng Tròn Giao Điểm">🪐 <span class="btn-lbl">3 VÒNG TRÒN</span></button>
            <button id="tab-dartboard" class="tab-btn" title="Bản đồ Tròn Hướng Tâm (Bia Bắn 54 Ô)">🎯 <span class="btn-lbl">HƯỚNG TÂM</span></button>
          </div>
          <span id="mandala-hint" class="mandala-hint">💡 <span class="hint-text">Chạm tâm: Thuận | Rìa: Nghịch</span></span>
        </div>
        
        <!-- Viewport SVG 1: 3 Vòng tròn giao điểm -->
        <div id="mandala-container" class="mandala-viewport"></div>

        <!-- Viewport SVG 2: Bia bắn tròn hướng tâm -->
        <div id="dartboard-container" class="mandala-viewport" style="display: none;"></div>
      </div>

      <!-- Thanh công cụ học & gia sư gọn gàng (Single Row Toolbar - Zero Scroll) -->
      <div class="trainer-bar">
        <!-- Bộ chuyển đổi chế độ đáy: Gia Sư AI vs Công Thức Mẫu -->
        <div class="bottom-mode-tabs">
          <button id="tab-mode-coach" class="tab-btn active" title="Gia sư dạy xoay 6 mặt LBL 7 bước">🧠 <span class="btn-lbl">GIA SƯ</span></button>
          <button id="tab-mode-formula" class="tab-btn" title="Thư viện công thức mẫu">📚 <span class="btn-lbl">MẪU</span></button>
        </div>

        <!-- Khối 1: Gia Sư AI (LBL 7 Bước) -->
        <div id="coach-panel" class="coach-panel-content">
          <span id="coach-stage-badge" class="coach-stage-badge">🏁 <span class="badge-lbl">BƯỚC </span>1/7</span>
          <div class="coach-info-wrapper">
            <span id="coach-case-name" class="coach-case-name">Khối Đang Nguyên Bản</span>
            <span id="coach-hint-text" class="coach-hint-text">Bấm "Xáo Trộn" góc trên để bắt đầu</span>
          </div>
          <div id="coach-steps" class="formula-steps-container"></div>
          <button id="btn-coach-stage" class="btn-action primary" title="Máy tự giải hoàn tất bước này rồi dừng lại">⏭ <span class="btn-lbl">Xong Bước</span></button>
          <button id="btn-coach-auto" class="btn-action" title="Máy tự động xoay giải toàn bộ về đích 6 mặt" style="display: none;">⚡ <span class="btn-lbl">Tự Giải</span></button>
          <button id="btn-coach-undo" class="btn-action btn-undo" title="Hoàn tác lại nước vừa xoay" disabled>↩️ <span class="btn-lbl">Hoàn Tác</span></button>
        </div>

        <!-- Khối 2: Học Công Thức Mẫu (Library) -->
        <div id="formula-panel" class="formula-panel-content" style="display: none;">
          <select id="formula-select" class="formula-select" title="Chọn công thức"></select>
          <span id="formula-desc" class="coach-hint-text" style="max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
          <div id="formula-steps" class="formula-steps-container"></div>
          <button id="btn-step-next" class="btn-action" title="Đi từng bước">⏭ <span class="btn-lbl">Bước</span></button>
          <button id="btn-play-demo" class="btn-action primary" title="Chạy mẫu tự động">▶ <span class="btn-lbl">Chạy</span></button>
          <button id="btn-reset-formula" class="btn-action" title="Đặt lại">↺ <span class="btn-lbl">Lại</span></button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
