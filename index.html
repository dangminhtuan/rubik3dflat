<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Rubik 3D & 3 Vòng Tròn Đồng Tâm</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Header gọn gàng tinh giản chữ -->
  <header class="app-header">
    <div class="logo-area">
      <span class="logo-text">🧊 <span class="btn-lbl">RUBIK 3D</span></span>
      <span id="status-badge" class="badge-tag">🟢 <span class="btn-lbl" data-i18n="status_solved">NGUYÊN BẢN</span></span>
    </div>

    <!-- Bộ đếm Bước & Thời gian (Toggleable hiển thị) -->
    <div id="stats-bar" class="stats-bar">
      <div class="stat-item"><span class="stat-label" data-i18n="stat_moves">BƯỚC:</span> <span id="move-count" class="stat-val">0</span></div>
      <div class="stat-item"><span class="stat-label" data-i18n="stat_time">GIỜ:</span> <span id="timer-display" class="stat-val">00:00.00</span></div>
    </div>

    <!-- Nút hành động nhanh: Menu Ngôn Ngữ, Menu Con Mắt & Xáo Trộn -->
    <div class="header-actions">
      <!-- Bộ chọn ngôn ngữ quốc tế -->
      <div class="lang-menu-container">
        <button id="btn-lang-toggle" class="btn-header" data-i18n-title="lang_select_title" title="Chọn ngôn ngữ">🌐 <span id="current-lang-label" class="btn-lbl">VI</span></button>
        <!-- Popover Ngôn ngữ -->
        <div id="lang-popover" class="lang-popover" style="display: none;">
          <div class="popover-header">
            <span data-i18n="lang_select_title">🌐 Chọn ngôn ngữ</span>
            <button id="btn-close-lang" class="btn-close-popover" title="Đóng">✕</button>
          </div>
          <div class="popover-body lang-list">
            <button class="lang-item active" data-lang="vi">
              <span class="lang-flag">🇻🇳</span>
              <span class="lang-name">Tiếng Việt</span>
              <span class="lang-check">✓</span>
            </button>
            <button class="lang-item" data-lang="en">
              <span class="lang-flag">🇬🇧</span>
              <span class="lang-name">English</span>
              <span class="lang-check">✓</span>
            </button>
            <button class="lang-item" data-lang="ja">
              <span class="lang-flag">🇯🇵</span>
              <span class="lang-name">日本語</span>
              <span class="lang-check">✓</span>
            </button>
            <button class="lang-item" data-lang="zh">
              <span class="lang-flag">🇨🇳</span>
              <span class="lang-name">中文</span>
              <span class="lang-check">✓</span>
            </button>
            <button class="lang-item" data-lang="es">
              <span class="lang-flag">🇪🇸</span>
              <span class="lang-name">Español</span>
              <span class="lang-check">✓</span>
            </button>
          </div>
        </div>
      </div>

      <div class="display-menu-container">
        <button id="btn-display-toggle" class="btn-header" data-i18n-title="btn_display_title" title="Tùy chọn hiển thị & ẩn hiện tính năng">👁️ <span class="btn-lbl" data-i18n="btn_display">HIỂN THỊ</span></button>
        <!-- Popover Tùy chọn giao diện -->
        <div id="display-popover" class="display-popover" style="display: none;">
          <div class="popover-header">
            <span data-i18n="popover_title">👁️ TÙY CHỌN HIỂN THỊ</span>
            <button id="btn-close-popover" class="btn-close-popover" title="Đóng">✕</button>
          </div>
          <div class="popover-body">
            <label class="popover-option">
              <input type="checkbox" id="chk-rubik-3d" checked>
              <div class="option-info">
                <span class="option-title" data-i18n="opt_rubik3d_title">🧊 Khối Rubik 3D</span>
                <span class="option-desc" data-i18n="opt_rubik3d_desc">Bật: Hiện mô phỏng 3D & gương | Tắt: 2D toàn màn hình</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-labels" checked>
              <div class="option-info">
                <span class="option-title" data-i18n="opt_labels_title">🏷️ Nhãn chữ nút bấm</span>
                <span class="option-desc" data-i18n="opt_labels_desc">Bật: Icon + Chữ | Tắt: Chỉ giữ Icon (Pro Mode)</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-stats" checked>
              <div class="option-info">
                <span class="option-title" data-i18n="opt_stats_title">⏱️ Bộ đếm Bước & Thời gian</span>
                <span class="option-desc" data-i18n="opt_stats_desc">Hiện thông số chơi game</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-move-bar" checked>
              <div class="option-info">
                <span class="option-title" data-i18n="opt_move_bar_title">⌨️ Thanh 12 phím xoay</span>
                <span class="option-desc" data-i18n="opt_move_bar_desc">Dải nút U, U', D, D', L, L'...</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-sound" checked>
              <div class="option-info">
                <span class="option-title" data-i18n="opt_sound_title">🔊 Âm thanh click</span>
                <span class="option-desc" data-i18n="opt_sound_desc">Âm thanh click khi xoay khối</span>
              </div>
            </label>
            <label class="popover-option">
              <input type="checkbox" id="chk-auto-solve">
              <div class="option-info">
                <span class="option-title" data-i18n="opt_auto_solve_title">⚡ Nút Tự Giải Hết</span>
                <span class="option-desc" data-i18n="opt_auto_solve_desc">Hiện nút máy tự xoay giải 6 mặt (Mặc định ẩn)</span>
              </div>
            </label>
          </div>
        </div>
      </div>
      <button id="btn-scramble" class="btn-header btn-scramble" data-i18n-title="btn_scramble_title" title="Xáo trộn ngẫu nhiên Rubik">🔀 <span class="btn-lbl" data-i18n="btn_scramble">Xáo Trộn</span></button>
    </div>
  </header>

  <!-- Bố cục chính tự thích ứng Desktop & Mobile (0 cuộn trang) -->
  <main class="main-layout">
    <!-- KHU VỰC 1: Khối 3D & 3 Gương Soi -->
    <section class="viewport-3d-col">
      <!-- Chip gương nhỏ gọn -->
      <div class="overlay-mirrors-chip" data-i18n-html="mirror_chip">
        🪞 Gương sau: <span style="color:#22c55e">B</span> | <span style="color:#e11d48">L</span> | <span style="color:#ffffff">D</span>
      </div>

      <!-- Nút điều khiển Zoom nhanh & Ghim góc nhìn yêu thích -->
      <div class="zoom-controls">
        <button id="btn-zoom-in" class="btn-zoom" data-i18n-title="zoom_in_title" title="Phóng to (+)">+</button>
        <button id="btn-zoom-out" class="btn-zoom" data-i18n-title="zoom_out_title" title="Thu nhỏ (−)">−</button>
        <button id="btn-save-view" class="btn-zoom" data-i18n-title="save_view_title" title="Lưu góc nhìn & mức zoom hiện tại làm Reset View (Bấm lại để cập nhật | Chuột phải/giữ để về góc gốc)">📌</button>
      </div>

      <!-- Canvas 3D Three.js -->
      <div id="rubik-canvas" class="canvas-wrapper">
        <!-- Nút Play ngón cái chuyên dụng (Vị trí 1 - Golden Thumb Zone) -->
        <button id="btn-coach-step" class="btn-thumb-play" data-i18n-title="play_thumb_title" title="Xoay đúng 1 nước tiếp theo (Nước đôi L2 = bấm L 2 lần)">
          <span class="thumb-icon">▶</span>
          <span class="btn-lbl" data-i18n="play_thumb_label">1 Nước</span>
        </button>
      </div>

      <!-- Thanh điều khiển trung tâm: Reset View & Reset Rubik + Thanh 12 phím xoay -->
      <div class="controls-bar" id="controls-bar">
        <!-- 2 Nút Reset đặt cạnh nhau ở giữa -->
        <div class="reset-actions-group">
          <button id="btn-reset-view" class="btn-action btn-reset-special" data-i18n-title="reset_view_title" title="Đặt lại góc nhìn 3D chuẩn">🎥 <span class="btn-lbl" data-i18n="reset_view">RESET VIEW</span></button>
          <button id="btn-reset-rubik" class="btn-action btn-reset-special" data-i18n-title="reset_rubik_title" title="Khôi phục Rubik về nguyên bản 6 mặt">🧊 <span class="btn-lbl" data-i18n="reset_rubik">RESET RUBIK</span></button>
        </div>

        <!-- Dải 12 phím xoay (có thể ẩn/hiện) -->
        <div id="quick-move-bar" class="quick-move-bar">
          <div class="move-group">
            <button class="btn-move" data-move="U">U</button>
            <button class="btn-move" data-move="U'">U'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="D">D</button>
            <button class="btn-move" data-move="D'">D'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="L">L</button>
            <button class="btn-move" data-move="L'">L'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="R">R</button>
            <button class="btn-move" data-move="R'">R'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="F">F</button>
            <button class="btn-move" data-move="F'">F'</button>
          </div>
          <div class="move-group">
            <button class="btn-move" data-move="B">B</button>
            <button class="btn-move" data-move="B'">B'</button>
          </div>
        </div>
      </div>
    </section>

    <!-- KHU VỰC 2: Bản Đồ 3 Vòng Tròn Giao Điểm & Thanh Học Công Thức -->
    <section class="right-panel">
      <!-- Bản đồ phẳng hóa 2D (Chuyển đổi giữa 3 Vòng Tròn và Hướng Tâm) -->
      <div class="mandala-section">
        <div class="section-header">
          <div class="view-mode-tabs">
            <button id="tab-mandala" class="tab-btn active" data-i18n-title="tab_mandala_title" title="Bản đồ 3 Vòng Tròn Giao Điểm">🪐 <span class="btn-lbl" data-i18n="tab_mandala">3 VÒNG TRÒN</span></button>
            <button id="tab-dartboard" class="tab-btn" data-i18n-title="tab_dartboard_title" title="Bản đồ Tròn Hướng Tâm (Bia Bắn 54 Ô)">🎯 <span class="btn-lbl" data-i18n="tab_dartboard">HƯỚNG TÂM</span></button>
          </div>
          <div class="section-header-actions">
            <button id="btn-reset-rubik-alt" class="btn-action btn-reset-special btn-reset-rubik-alt" data-i18n-title="reset_rubik_title" title="Khôi phục Rubik về nguyên bản 6 mặt">🧊 <span class="btn-lbl" data-i18n="reset_rubik">RESET RUBIK</span></button>
            <span id="mandala-hint" class="mandala-hint" data-i18n="mandala_hint">💡 <span class="hint-text">Chạm tâm: Thuận | Rìa: Nghịch</span></span>
          </div>
        </div>
        
        <!-- Viewport SVG 1: 3 Vòng tròn giao điểm -->
        <div id="mandala-container" class="mandala-viewport"></div>

        <!-- Viewport SVG 2: Bia bắn tròn hướng tâm -->
        <div id="dartboard-container" class="mandala-viewport" style="display: none;"></div>
      </div>

      <!-- Thanh công cụ học & gia sư (2 Tầng Sư Phạm - Zero Scroll) -->
      <div class="trainer-bar">
        <!-- TẦNG 1: BẢNG SƯ PHẠM (LUÔN HIỂN THỊ - KHÔNG BỊ ẨN KHI TẮT TEXT NÚT) -->
        <div class="coach-pedagogy-banner">
          <div id="coach-pedagogy-info" class="pedagogy-info-container">
            <span id="coach-stage-badge" class="coach-stage-badge">🏁 <span class="badge-lbl" data-i18n="coach_stage_prefix">BƯỚC </span>1/7</span>
            <span id="coach-case-name" class="coach-case-name" data-i18n="coach_initial_case">Khối Đang Nguyên Bản</span>
            <span id="coach-formula-badge" class="coach-formula-badge" style="display: none;">📚 MẪU</span>
            <span class="pedagogy-separator">|</span>
            <span id="coach-hint-text" class="coach-hint-text" data-i18n="coach_initial_hint">Bấm "Xáo Trộn" góc trên để bắt đầu</span>
          </div>
          <div id="formula-pedagogy-info" class="pedagogy-info-container" style="display: none;">
            <span class="formula-pedagogy-title" data-i18n="formula_library_title">📚 THƯ VIỆN CÔNG THỨC:</span>
            <span id="formula-desc" class="coach-hint-text" data-i18n="formula_library_default_desc">Chọn công thức để xem chi tiết</span>
          </div>
        </div>

        <!-- TẦNG 2: THANH ĐIỀU KHIỂN & NƯỚC ĐI -->
        <div class="trainer-controls-row">
          <!-- Bộ chuyển đổi chế độ: Gia Sư AI vs Công Thức Mẫu -->
          <div class="bottom-mode-tabs">
            <button id="tab-mode-coach" class="tab-btn active" data-i18n-title="tab_coach_title" title="Gia sư dạy xoay 6 mặt LBL 7 bước">🧠 <span class="btn-lbl" data-i18n="tab_coach">GIA SƯ</span></button>
            <button id="tab-mode-formula" class="tab-btn" data-i18n-title="tab_formula_title" title="Thư viện công thức mẫu">📚 <span class="btn-lbl" data-i18n="tab_formula">MẪU</span></button>
          </div>

          <!-- Nhóm điều khiển Gia Sư AI -->
          <div id="coach-panel" class="coach-panel-content">
            <div id="coach-steps" class="formula-steps-container"></div>
            <button id="btn-coach-step-inline" class="btn-action primary btn-coach-step-inline" data-i18n-title="play_thumb_title" title="Xoay đúng 1 nước tiếp theo (Nước đôi L2 = bấm L 2 lần)">▶ <span class="btn-lbl" data-i18n="play_thumb_label">1 Nước</span></button>
            <button id="btn-coach-stage" class="btn-action primary" data-i18n-title="btn_stage_solve_title" title="Máy tự giải hoàn tất bước này rồi dừng lại">⏭ <span class="btn-lbl" data-i18n="btn_stage_solve">Xong Bước</span></button>
            <button id="btn-coach-auto" class="btn-action" data-i18n-title="btn_auto_solve_title" title="Máy tự động xoay giải toàn bộ về đích 6 mặt" style="display: none;">⚡ <span class="btn-lbl" data-i18n="btn_auto_solve">Tự Giải</span></button>
            <button id="btn-coach-undo" class="btn-action btn-undo" data-i18n-title="btn_undo_title" title="Hoàn tác lại nước vừa xoay" disabled>↩️ <span class="btn-lbl" data-i18n="btn_undo">Hoàn Tác</span></button>
          </div>

          <!-- Nhóm điều khiển Thư Viện Mẫu -->
          <div id="formula-panel" class="formula-panel-content" style="display: none;">
            <select id="formula-select" class="formula-select" title="Chọn công thức"></select>
            <div id="formula-steps" class="formula-steps-container"></div>
            <button id="btn-step-next" class="btn-action" data-i18n-title="btn_step_next_title" title="Đi từng bước">⏭ <span class="btn-lbl" data-i18n="btn_step_next">Bước</span></button>
            <button id="btn-play-demo" class="btn-action primary" data-i18n-title="btn_play_demo_title" title="Chạy mẫu tự động">▶ <span class="btn-lbl" data-i18n="btn_play_demo">Chạy</span></button>
            <button id="btn-reset-formula" class="btn-action" data-i18n-title="btn_reset_formula_title" title="Đặt lại">↺ <span class="btn-lbl" data-i18n="btn_reset_formula">Lại</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
